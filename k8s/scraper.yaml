# --- Scraper Kubernetes Manifests ---
# Managed by Tilt - run `tilt up` to deploy
# Tear down with: `tilt down`

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-deployment
  labels:
    app: scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scraper
  template:
    metadata:
      labels:
        app: scraper
    spec:
      containers:
        - name: scraper
          image: scraper
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WEBSHARE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: webshare-api
                  key: api-key
                  optional: true
            - name: WEBSHARE_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: webshare-api
                  key: proxy-username
                  optional: true
            - name: WEBSHARE_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webshare-api
                  key: proxy-password
                  optional: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scraper-service
spec:
  selector:
    app: scraper
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
