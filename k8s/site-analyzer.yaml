# --- Site Analyzer Kubernetes Manifests ---
# Managed by Tilt - run `tilt up` to deploy
# Tear down with: `tilt down`

apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-analyzer-deployment
  labels:
    app: site-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-analyzer
  template:
    metadata:
      labels:
        app: site-analyzer
    spec:
      containers:
        - name: site-analyzer
          image: site-analyzer
          ports:
            - containerPort: 8090
          env:
            - name: PORT
              value: "8090"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: site-analyzer-service
spec:
  selector:
    app: site-analyzer
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  type: ClusterIP
